apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: takecare-mysql-pvc
spec:
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takecare-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: takecare-mysql
  template:
    metadata:
      labels:
        app: takecare-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: takecare
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: takecare-db
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: takecare-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: takecare-mysql
spec:
  selector:
    app: takecare-mysql
  ports:
    - port: 3306
      targetPort: 3306
